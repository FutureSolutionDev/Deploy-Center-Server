name: Build & Test

on:
  push:
    branches: [main, master, develop, "version/**"]
  pull_request:
    branches: [main, master, develop, "version/**"]

jobs:
  build-and-test:
    name: Build & Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root_password
          MARIADB_DATABASE: deploy_center_test
          MARIADB_USER: test_user
          MARIADB_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      # v3.0 F-001 requires Redis for the BullMQ-backed queue. Without
      # this service every integration test that touches the queue
      # auto-skips via `if (!redisUp) return`, defeating the 40 % coverage
      # gate.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Check TypeScript compilation
        run: npm run build

      - name: 🧪 Run tests
        run: npm test
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: deploy_center_test
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_DIALECT: mariadb
          # v3.0 F-001 — point integration tests at the live Redis service
          # declared above. REDIS_DB=1 keeps test data off DB 0 (dev/prod
          # convention enforced by helpers/redis.ts).
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_DB: 1
          JWT_SECRET: test-jwt-secret-for-ci-only
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-only
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef

      - name: 📊 Upload coverage reports
        uses: codecov/codecov-action@v4
        if: matrix.node-version == '20.x'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: ✅ Build success notification
        if: success()
        run: echo "✅ Build and tests passed successfully!"

      - name: ❌ Build failure notification
        if: failure()
        run: echo "❌ Build or tests failed. Please check the logs."
