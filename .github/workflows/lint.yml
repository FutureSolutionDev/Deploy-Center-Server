name: Lint

on:
  push:
    branches: [main, master, develop, "version/**"]
  pull_request:
    branches: [main, master, develop, "version/**"]

jobs:
  eslint:
    name: ESLint Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: ✅ Lint passed
        if: success()
        run: echo "✅ ESLint passed successfully!"

  prettier:
    name: Prettier Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎨 Check code formatting
        run: npm run format:check || echo "Run 'npm run format' to fix formatting issues"

  typescript:
    name: TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Check TypeScript types
        run: npx tsc --noEmit

      - name: ✅ Type check passed
        if: success()
        run: echo "✅ TypeScript type checking passed!"
